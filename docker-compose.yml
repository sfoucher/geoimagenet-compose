services:

  api:
    image: &annotation_api_image ghcr.io/sfoucher/geoimagenet-api:1.4.2-gin.1@sha256:a20d63d262e85302cfe0f136d41cba78972ef71377dc532475fae696018b261e
    container_name: api
    command:
      [
        "gunicorn",
        "--config",
        "/code/gunicorn.py",
        "geoimagenet_api:application",
      ]
    volumes:
      - ./config/api/gunicorn.py:/code/gunicorn.py
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/api/v1/changelog/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    environment:
      - GEOIMAGENET_API_POSTGIS_DB=${POSTGIS_DB}
      - GEOIMAGENET_API_POSTGIS_HOST=postgis
      - GEOIMAGENET_API_POSTGIS_USER=${POSTGIS_USER}
      - GEOIMAGENET_API_POSTGIS_PASSWORD=${POSTGIS_PASSWORD}
      # internal address: the API forwards the user's cookies to identify them. Through
      # https://${HOST_FQDN} this failed whenever HOST_FQDN is localhost (it resolves to the
      # api container itself), and in production it looped out through nginx.
      - GEOIMAGENET_API_MAGPIE_URL=http://magpie:2001
      - GEOIMAGENET_API_BATCH_CREATION_URL=https://${HOST_FQDN}/ml/processes/batch-creation/jobs
      - GEOIMAGENET_API_MAGPIE_VERIFY_SSL=true
      - GEOIMAGENET_API_ALLOW_CORS=false
      - GEOIMAGENET_API_SENTRY_URL=${GEOIMAGENET_API_SENTRY_URL}
    restart: unless-stopped

  geoserver_setup:
    image: *annotation_api_image
    container_name: geoserver_setup
    entrypoint: ["geoserver_setup"]
    # one-shot, run by hand: "./geoimagenet-compose.sh run --rm geoserver_setup ...". The
    # profile keeps a bare "up" from starting it.
    profiles: ["setup"]
    depends_on:
      postgis:
        condition: service_healthy
      geoserver:
        condition: service_healthy
    volumes:
      - image_data:/nas
      - ./config/api/geoserver_config.yaml:/code/geoimagenet_api/geoserver_setup/config.yaml
    environment:
      - GEOIMAGENET_API_GS_MIRROR_URL=http://geoserver:8080/geoserver
      - GEOIMAGENET_API_GS_MIRROR_USER=admin
      - GEOIMAGENET_API_GS_MIRROR_PASSWORD=${GEOIMAGENET_API_GS_MIRROR_PASSWORD}
      - GEOIMAGENET_API_GS_DATASTORE_URL=${GEOIMAGENET_API_GS_DATASTORE_URL}
      - GEOIMAGENET_API_GS_DATASTORE_USER=admin
      - GEOIMAGENET_API_GS_DATASTORE_PASSWORD=${GEOIMAGENET_API_GS_DATASTORE_PASSWORD}
      - GEOIMAGENET_API_POSTGIS_DB=${POSTGIS_DB}
      - GEOIMAGENET_API_POSTGIS_HOST=postgis
      - GEOIMAGENET_API_POSTGIS_USER=${POSTGIS_USER}
      - GEOIMAGENET_API_POSTGIS_PASSWORD=${POSTGIS_PASSWORD}
      - GEOIMAGENET_API_SENTRY_URL=${GEOIMAGENET_API_SENTRY_URL}

  migrations:
    image: *annotation_api_image
    container_name: migrations
    entrypoint: ["migrate"]
    command: ["upgrade", "head"]
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      - GEOIMAGENET_API_WAIT_FOR_DB_CONNECTION_ON_IMPORT=true
      - GEOIMAGENET_API_POSTGIS_DB=${POSTGIS_DB}
      - GEOIMAGENET_API_POSTGIS_HOST=postgis
      - GEOIMAGENET_API_POSTGIS_USER=${POSTGIS_USER}
      - GEOIMAGENET_API_POSTGIS_PASSWORD=${POSTGIS_PASSWORD}
      - GEOIMAGENET_API_SENTRY_URL=${GEOIMAGENET_API_SENTRY_URL}

  # One-shot: copies the static frontend from its image into the "public" volume that nginx
  # serves. An image mount would be simpler, but Docker 29 fails to mount an image referenced
  # by digest ("file name too long": the mount path encodes the reference), and the digest
  # pin matters more. Runs on every "up", so an image change is picked up.
  frontend_files:
    image: ghcr.io/sfoucher/geoimagenet-frontend:1.8.3-gin.3@sha256:bd4cebb6d2cda58f1f6a33cb5716e7e3044cfea68b53a9f72c11e41934d4ece7
    container_name: frontend_files
    command: ["sh", "-c", "rm -rf /out/* && cp -r /usr/share/frontend/. /out/"]
    volumes:
      - public:/out
    restart: "no"

  nginx:
    image: pavics/canarieapi:0.4.3@sha256:1b886f944b9295304b5a81e954c39ee28ca8a6169afc5dd13a851d3f9a88d8f9
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    # Only what nginx proxies to directly; /api and /geoserver go through Twitcher.
    # restart: true restarts nginx when twitcher or magpie is recreated, so it never keeps
    # a stale container address (the old "502 after restarting a service" trap).
    depends_on:
      frontend_files:
        condition: service_completed_successfully
      twitcher:
        condition: service_healthy
        restart: true
      magpie:
        condition: service_healthy
        restart: true
    volumes:
      - ./static/pdf:/public/pdf
      - ./config/nginx/conf.d:/etc/nginx/conf.d
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./config/canarie-api/canarie_api_config.py:/config/canarie_api_config.py
      - ./config/canarie-api/doc.html:/opt/local/src/CanarieAPI/canarieapi/static/doc.html
      - ./config/canarie-api/res:/opt/local/src/CanarieAPI/canarieapi/static/res
      - ./config/canarie-api/res/static/background.jpg:/opt/local/src/CanarieAPI/canarieapi/static/background.jpg
      - ./config/canarie-api/res/static/favicon.ico:/opt/local/src/CanarieAPI/canarieapi/static/favicon.ico
      - ./config/canarie-api/res/static/style.css:/opt/local/src/CanarieAPI/canarieapi/static/style.css
      - ./config/canarie-api/res/templates/layout.html:/opt/local/src/CanarieAPI/canarieapi/templates/layout.html
      - ${SSL_CERTIFICATE}:/etc/nginx/cert.pem
      - ${SSL_PRIVATE_KEY}:/etc/nginx/privkey.pem
      # the static frontend, copied by frontend_files (it has an empty pdf/ folder for the mount above)
      - public:/public:ro
    environment:
      CANARIE_API_CONFIG_FN: /config/canarie_api_config.py
    healthcheck:
      test: curl --insecure --fail -s -L https://localhost/canarie || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    restart: always

  postgis:
    # index digest, tag kept for reading. Never re-resolve the tag: the PostgreSQL major version
    # never changes under "17-3.5", but its PostGIS build does (see "pin by digest" in README).
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    container_name: postgis
    environment:
      # The bind-mounted initdb.d below REPLACES the image's own 10_postgis.sh (it never runs); the
      # script there creates gis, magpie and twitcher, with PostGIS in gis only. "postgres" is harmless.
      - POSTGRES_DB=postgres
      - POSTGRES_USER=${POSTGIS_USER}
      - POSTGRES_PASSWORD=${POSTGIS_PASSWORD}
      # the 9.6 cluster used this locale; keeps text ordering (taxonomy names) unchanged
      - POSTGRES_INITDB_ARGS=--locale=C.UTF-8
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./config/postgres/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    # Use docker-compose.override.yml to open ports as required
    # ports:
    #   - "5432:5432"
    restart: unless-stopped
    healthcheck:
      # A real TCP login on "gis": the init scripts run on a temporary server bound to the Unix
      # socket only, so this cannot pass before the databases exist.
      test: ["CMD-SHELL", "PGPASSWORD=$$POSTGRES_PASSWORD psql -h localhost -U $$POSTGRES_USER -d gis -Atc 'select postgis_version()' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  geoserver:
    # no public 2.14 image exists: the override replaces it with kartoza/geoserver:2.15.0
    image: docker-registry.crim.ca/geoimagenet/geoserver:2.14.0
    container_name: geoserver
    # ports:
    #   - "8600:8080"
    environment:
      - >-
        JAVA_OPTS=-Djava.awt.headless=true -server -Xms2G -Xmx10G -Xrs -XX:PerfDataSamplingInterval=500
                  -Dorg.geotools.referencing.forceXY=true -XX:SoftRefLRUPolicyMSPerMB=36000 -XX:+UseParallelGC
                  -XX:NewRatio=2 -XX:+CMSClassUnloadingEnabled -Dfile.encoding=UTF8 -Duser.timezone=GMT
                  -Djavax.servlet.request.encoding=UTF-8 -Djavax.servlet.response.encoding=UTF-8
                  -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true
      - >-
        GEOSERVER_OPTS=-Djava.awt.headless=true -server -Xms2G -Xmx10G -Xrs -XX:PerfDataSamplingInterval=500
                  -Dorg.geotools.referencing.forceXY=true -XX:SoftRefLRUPolicyMSPerMB=36000 -XX:+UseParallelGC
                  -XX:NewRatio=2 -XX:+CMSClassUnloadingEnabled -Dfile.encoding=UTF8 -Duser.timezone=GMT
                  -Djavax.servlet.request.encoding=UTF-8 -Djavax.servlet.response.encoding=UTF-8
                  -Duser.timezone=GMT -Dorg.geotools.shapefile.datetime=true
    volumes:
      - geoserver_data:/opt/geoserver/data_dir
      - ./config/geoserver/styles/annotations.css:/opt/geoserver/data_dir/styles/annotations.css
      - ./config/geoserver/styles/annotations.xml:/opt/geoserver/data_dir/styles/annotations.xml
      - ./config/geoserver/web.xml:/usr/local/tomcat/conf/web.xml
        # This config makes GeoServer completely open and public
      # - ./config/geoserver/config.xml:/opt/geoserver/data_dir/security/config.xml
    env_file:
      - config/geoserver/docker-env/geoserver.env
    depends_on:
      postgis:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      # GeoServer itself, not Tomcat's root page
      test: curl --fail -s -o /dev/null http://localhost:8080/geoserver/web/ || exit 1
      interval: 1m30s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 10s

  magpie:
    image: pavics/magpie:1.6.0@sha256:5866aea53b2c6366b6c36a08199d8ba580d9feba5788daf0a2382a09cc50bb00
    container_name: magpie
    # Use docker-compose.override.yml to open ports as required
    # ports:
    #   - "2001:2001"
    env_file:
      - ./config/postgres/credentials.env
      - ./config/magpie/magpie.env
    environment:
      HOSTNAME: $HOST_FQDN
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:2001/version')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    volumes:
      - ./config/magpie/permissions.cfg:/opt/local/src/magpie/config/permissions.cfg
      - ./config/magpie/providers.cfg:/opt/local/src/magpie/config/providers.cfg
      - ./config/magpie/magpie.ini:/opt/local/src/magpie/config/magpie.ini
      - ./config/magpie/magpie.env:/opt/local/src/magpie/env/magpie.env
      - ./config/postgres/credentials.env:/opt/local/src/magpie/env/postgres.env
    command: bash -c 'crond && gunicorn --paste $$MAGPIE_DIR/config/magpie.ini'
    restart: always

  twitcher:
    image: pavics/twitcher:magpie-1.6.0@sha256:fdbaa5b67a5fe7598fbe59ceff1c9cf6aeaf8a5fc5c7ab54d1482c17a7635935
    container_name: twitcher
    # Use docker-compose.override.yml to open ports as required
    # ports:
    #   - "5000:5000"
    #   - "2002:8083"
    depends_on:
      postgis:
        condition: service_healthy
      magpie:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request as u; u.urlopen('http://localhost:8001/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    env_file:
      - ./config/postgres/credentials.env
      - ./config/magpie/magpie.env
    volumes:
      - ./config/twitcher/twitcher.ini:/opt/birdhouse/src/twitcher/twitcher.ini
    command: gunicorn --paste /opt/birdhouse/src/twitcher/twitcher.ini
    restart: always

# TODO: use 'docker-compose.override.yml' to use real mounted volumes
volumes:
  public:
  image_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /nas
  postgis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/db_gis_17     # the old 9.6 directory, /data/db_gis_data, is never mounted: it is the rollback
  geoserver_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /data/geoserver/data_dir
